# Configuracion general
spring.application.name=zeusshop-productos
# Puerto 8081 para no chocar con Tomcat (8080) de la evidencia anterior
server.port=8081

# Conexion a MariaDB (los valores se pueden cambiar con variables de entorno)
spring.datasource.url=jdbc:mariadb://localhost:3306/zeusshop_express
spring.datasource.username=${DB_USUARIO:zeusshop}
spring.datasource.password=${DB_CLAVE:Zeus2026}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA: no modifica la base de datos existente
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Respeta los nombres de columna tal cual (idProducto, fechaRegistro...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Vistas: sin cache durante el desarrollo
spring.thymeleaf.cache=false
