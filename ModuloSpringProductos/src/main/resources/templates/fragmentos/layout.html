<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Cabecera HTML reutilizable: recibe el título de la página -->
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - ZeusShop Express'">ZeusShop Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<!-- Barra de navegación reutilizable -->
<nav class="barra navbar navbar-dark px-3" th:fragment="barra">
    <a class="navbar-brand fw-bold" th:href="@{/productos}">ZeusShop Express</a>
</nav>

<!-- Pie de página reutilizable -->
<footer class="pie text-center text-muted py-4" th:fragment="pie">
    &copy; 2026 ZeusShop Express - Gestión de pedidos e inventarios
</footer>

</body>
</html>
