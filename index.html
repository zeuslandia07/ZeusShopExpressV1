<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZeusShop Express | Iniciar sesión</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Fuente Roboto -->
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>


<body>

    <!-- Barra superior -->
    <header class="login-header">

        <div class="container-fluid">

            <img
                src="assets/img/logo-header.png"
                alt="ZeusShop Express"
                class="login-header-logo"
            >

        </div>

    </header>


    <!-- Contenido principal -->
    <main class="login-container">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                    <!-- Logo principal -->
                    <div class="text-center login-brand">

                        <img
                            src="assets/img/logo-login.png"
                            alt="ZeusShop Express"
                            class="login-logo"
                        >

                        <p>
                            Gestiona pedidos, inventario y ventas
                        </p>

                    </div>


                    <!-- Tarjeta de inicio de sesión -->
                    <div class="card login-card">

                        <div class="card-body">

                            <h1 class="login-title">
                                Iniciar sesión
                            </h1>

                            <p class="login-subtitle">
                                Bienvenido de nuevo
                            </p>


                            <!-- Formulario -->
                            <form id="loginForm">


                                <!-- Correo -->
                                <div class="mb-3">

                                    <label
                                        for="correo"
                                        class="form-label"
                                    >
                                        Correo electrónico
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        id="correo"
                                        placeholder="Ingrese su correo"
                                        required
                                    >

                                </div>


                                <!-- Contraseña -->
                                <div class="mb-2">

                                    <label
                                        for="password"
                                        class="form-label"
                                    >
                                        Contraseña
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        placeholder="Ingrese su contraseña"
                                        required
                                    >

                                </div>


                                <!-- Recordar sesión -->
                                <div class="form-check remember-container">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="recordar"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="recordar"
                                    >
                                        Recordar sesión
                                    </label>

                                </div>


                                <!-- Rol -->
                                <div class="mb-3">

                                    <label
                                        for="rol"
                                        class="form-label"
                                    >
                                        Rol de usuario
                                    </label>

                                    <select
                                        class="form-select"
                                        id="rol"
                                    >

                                        <option value="administrador">
                                            Administrador
                                        </option>

                                        <option value="vendedor">
                                            Vendedor
                                        </option>

                                    </select>

                                </div>


                                <!-- Botón -->
                                <button
                                    type="submit"
                                    class="btn login-button w-100"
                                >
                                    Iniciar sesión
                                </button>


                                <!-- Mensaje -->
                                <div
                                    id="loginMessage"
                                    class="mt-3"
                                ></div>

                            </form>

                        </div>

                    </div>


                    <!-- Recuperación -->
                    <div class="text-center">

                        <a
                            href="#"
                            id="forgotPassword"
                            class="forgot-password"
                        >
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>


                    <!-- Pie -->
                    <p class="login-footer text-center">

                        © 2026 ZeusShop Express
                        - Gestión de pedidos e inventarios

                    </p>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="assets/js/app.js"></script>

</body>

</html>
